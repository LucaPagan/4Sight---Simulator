[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audience-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "rq>=2,<3", "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.14,<2", "statsmodels>=0.14,<1", "scikit-learn>=1.5,<2", "httpx>=0.27,<1", "python-multipart>=0.0.18", "boto3>=1.35,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
audience = "audience_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
