services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audience
      POSTGRES_USER: audience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audience -d audience"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-audience-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
    volumes: ["minio-data:/data"]
  minio-init:
    build: .
    depends_on: [minio]
    environment:
      AUDIENCE_S3_ENDPOINT: http://minio:9000
      AUDIENCE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-audience-local}
      AUDIENCE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-development-only}
    command: ["python", "-m", "audience_simulator.storage_init"]
  api:
    build: .
    environment: &backend-env
      AUDIENCE_DATABASE_URL: postgresql+psycopg://audience:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/audience
      AUDIENCE_REDIS_URL: redis://redis:6379/0
      AUDIENCE_QUEUE_MODE: rq
      AUDIENCE_OLLAMA_URL: http://host.docker.internal:11434
      AUDIENCE_OLLAMA_MODEL: ${AUDIENCE_OLLAMA_MODEL:-qwen3.5:9b}
      AUDIENCE_GEMINI_API_KEY: "${AUDIENCE_GEMINI_API_KEY:-}"
      AUDIENCE_GEMINI_FREE_TIER_CONFIRMED: ${AUDIENCE_GEMINI_FREE_TIER_CONFIRMED:-false}
      AUDIENCE_GEMINI_REQUESTS_PER_MINUTE: ${AUDIENCE_GEMINI_REQUESTS_PER_MINUTE:-10}
      AUDIENCE_CLOUDFLARE_API_TOKEN: "${AUDIENCE_CLOUDFLARE_API_TOKEN:-}"
      AUDIENCE_CLOUDFLARE_ACCOUNT_ID: "${AUDIENCE_CLOUDFLARE_ACCOUNT_ID:-}"
      AUDIENCE_CLOUDFLARE_FREE_TIER_CONFIRMED: ${AUDIENCE_CLOUDFLARE_FREE_TIER_CONFIRMED:-false}
      AUDIENCE_CLOUDFLARE_REQUESTS_PER_MINUTE: ${AUDIENCE_CLOUDFLARE_REQUESTS_PER_MINUTE:-30}
      AUDIENCE_S3_ENDPOINT: http://minio:9000
      AUDIENCE_S3_BUCKET: audience
      AUDIENCE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-audience-local}
      AUDIENCE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-development-only}
    volumes: ["./data:/app/data:ro", "./artifacts:/app/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      retries: 20
  worker:
    build: .
    command: ["python", "-m", "audience_simulator.worker"]
    environment: *backend-env
    volumes: ["./data:/app/data:ro", "./artifacts:/app/artifacts"]
    depends_on:
      api: {condition: service_healthy}
  web:
    build: ./frontend
    environment:
      API_BASE_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  cloud-worker:
    build: .
    command: ["python", "-m", "audience_simulator.worker"]
    environment:
      <<: *backend-env
      AUDIENCE_WORKER_QUEUE: cloud
    volumes: ["./data:/app/data:ro", "./artifacts:/app/artifacts"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  minio-data:
